---
- name: Set up test qubes
  import_playbook: setup.yml

- name: Clean mgmt dispvms before split-SSH
  import_playbook: cleanup-mgmt-dispvms.yml

- name: Deploy split-SSH
  import_playbook: ../playbooks/split_ssh.yml
  vars:
    vault: "{{ test_prefix | default('ci') }}-vault-ssh"
    client_agents: "{{ hostvars['localhost'].ci_client_agents }}"
    vault_default_agent: shared
    client_default_agent: shared

- name: Clean mgmt dispvms before split-GPG
  import_playbook: cleanup-mgmt-dispvms.yml

- name: Deploy split-GPG
  import_playbook: ../playbooks/split_gpg.yml
  vars:
    vault: "{{ test_prefix | default('ci') }}-vault-gpg"
    clients: "{{ test_prefix | default('ci') }}-work"

- name: Clean mgmt dispvms before bind-dirs
  import_playbook: cleanup-mgmt-dispvms.yml

- name: Deploy bind-dirs
  import_playbook: ../playbooks/bind_dirs.yml
  vars:
    qubes: "{{ test_prefix | default('ci') }}-work"
    paths: /opt/ci-test-persist
    tag: ci-test

- name: Verify split-SSH
  import_playbook: verify-split-ssh.yml

- name: Verify split-GPG
  import_playbook: verify-split-gpg.yml

- name: Verify bind-dirs
  import_playbook: verify-bind-dirs.yml

- name: Clean mgmt dispvms before audiovm
  import_playbook: cleanup-mgmt-dispvms.yml

- name: Deploy a new audiovm
  import_playbook: ../playbooks/audiovm.yml
  vars:
    audiovm_name: "{{ test_prefix | default('ci') }}-audio"
    audiovm_template: "{{ hostvars['localhost'].effective_template }}"
    audiovm_pci_devices: []

- name: Deploy the disposable USB qube as audiovm
  import_playbook: ../playbooks/audiovm.yml
  vars:
    audiovm_name: "{{ test_prefix | default('ci') }}-usb"
    audiovm_clients: "{{ test_prefix | default('ci') }}-work"
    audiovm_pci_devices: []

- name: Verify audiovm
  import_playbook: verify-audiovm.yml

- name: Clean mgmt dispvms before guivm
  import_playbook: cleanup-mgmt-dispvms.yml

- name: Deploy a GUI domain
  import_playbook: ../playbooks/guivm.yml
  vars:
    guivm_name: "{{ test_prefix | default('ci') }}-gui"
    guivm_template: "{{ hostvars['localhost'].effective_template }}"
    guivm_dummy_modules: [psu, backlight]
    guivm_clients: "{{ test_prefix | default('ci') }}-personal"

- name: Deploy a VNC GUI domain
  import_playbook: ../playbooks/guivm.yml
  vars:
    guivm_name: "{{ test_prefix | default('ci') }}-gui-vnc"
    guivm_type: vnc
    guivm_template: "{{ hostvars['localhost'].effective_template }}"
    guivm_password_hash: "{{ hostvars['localhost'].ci_guivm_password_hash }}"

- name: Verify GUI domains
  import_playbook: verify-guivm.yml

- name: Clean up test qubes
  import_playbook: cleanup.yml
